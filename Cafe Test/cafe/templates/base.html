<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf" content="{{ csrf_token }}">
<title>{% block title %}New Found Cafe{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Poppins:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='css/cafe.css') }}">
{% block head %}{% endblock %}
</head><body>
<header class="top">
  <a href="{{ url_for('main.home') }}" class="brand">New Found Cafe</a>
  <nav>
    <a href="{{ url_for('menu.menu') }}" class="{{ 'on' if request.endpoint == 'menu.menu' }}">Menu</a>
    <a href="{{ url_for('orders.your_order') }}" class="{{ 'on' if request.endpoint == 'orders.your_order' }}">Your Order</a>
    {% if is_admin %}<a href="{{ url_for('admin.dashboard') }}" class="{{ 'on' if request.endpoint and request.endpoint.startswith('admin.') }}">Admin</a>{% endif %}
    <a href="{{ url_for('account.account') }}" class="{{ 'on' if request.endpoint == 'account.account' }}">Account</a>
    {% if current_user %}
    <form method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button>Logout</button></form>
    {% else %}<a href="{{ url_for('auth.login') }}">Login</a>{% endif %}
  </nav>
</header>
<main class="{% block mainclass %}{% endblock %}">
{% for m in get_flashed_messages() %}<p class="flash">{{ m }}</p>{% endfor %}
{% block content %}{% endblock %}
</main>
</body></html>
